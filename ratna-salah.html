const RVAstro=(()=>{

const LORD_EN=['Ketu','Venus','Sun','Moon','Mars','Rahu','Jupiter','Saturn','Mercury'];
const DURATION=[7,20,6,10,7,18,16,19,17];
const P_EN=['Sun','Moon','Mercury','Venus','Mars','Jupiter','Saturn','Rahu','Ketu'];
const P_HI=['सूर्य','चंद्र','बुध','शुक्र','मंगल','गुरु','शनि','राहु','केतु'];
const mod=(x,n=360)=>((x%n)+n)%n, rad=x=>x*Math.PI/180, deg=x=>x*180/Math.PI;
const jd=d=>d.getTime()/86400000+2440587.5;

function sunData(d){
 let w=282.9404+4.70935E-5*d,e=.016709-1.151E-9*d,M=mod(356.0470+.9856002585*d),E=solveE(M,e);
 let x=Math.cos(E)-e,y=Math.sin(E)*Math.sqrt(1-e*e),r=Math.sqrt(x*x+y*y),v=deg(Math.atan2(y,x)),lon=mod(v+w);
 return {lon,r,x:r*Math.cos(rad(lon)),y:r*Math.sin(rad(lon))};
}
const ELEMENTS={
 Mercury:d=>[48.3313+3.24587E-5*d,7.0047+5E-8*d,29.1241+1.01444E-5*d,.387098,.205635+5.59E-10*d,168.6562+4.0923344368*d],
 Venus:d=>[76.6799+2.46590E-5*d,3.3946+2.75E-8*d,54.8910+1.38374E-5*d,.723330,.006773-1.302E-9*d,48.0052+1.6021302244*d],
 Mars:d=>[49.5574+2.11081E-5*d,1.8497-1.78E-8*d,286.5016+2.92961E-5*d,1.523688,.093405+2.516E-9*d,18.6021+.5240207766*d],
 Jupiter:d=>[100.4542+2.76854E-5*d,1.3030-1.557E-7*d,273.8777+1.64505E-5*d,5.20256,.048498+4.469E-9*d,19.8950+.0830853001*d],
 Saturn:d=>[113.6634+2.38980E-5*d,2.4886-1.081E-7*d,339.3939+2.97661E-5*d,9.55475,.055546-9.499E-9*d,316.9670+.0334442282*d]
};
function planetHelio(name,d){
 let [N,i,w,a,e,M]=ELEMENTS[name](d);N=rad(N);i=rad(i);w=rad(w);M=mod(M);
 let E=solveE(M,e),xv=a*(Math.cos(E)-e),yv=a*Math.sqrt(1-e*e)*Math.sin(E),v=Math.atan2(yv,xv),r=Math.sqrt(xv*xv+yv*yv);
 let xh=r*(Math.cos(N)*Math.cos(v+w)-Math.sin(N)*Math.sin(v+w)*Math.cos(i));

 return {x:xh,y:yh,z:zh,lon:mod(deg(Math.atan2(yh,xh)))};

function moonTropical(j){
 let n=j-2451545;
 let L=mod(218.316+13.176396*n),M=mod(134.963+13.064993*n),D=mod(297.850+12.190749*n),F=mod(93.272+13.229350*n),Ms=mod(357.529+.9856003*n);

function positions(date){
 let j=jd(date),d=j-2451543.5,s=sunData(d),out={};
 out.Sun=mod(s.lon-ayan(j));out.Moon=mod(moonTropical(j)-ayan(j));

   let h=planetHelio(p,d),x=h.x+s.x,y=h.y+s.y;
   out[p]=mod(deg(Math.atan2(y,x))-ayan(j));
 }
 let rahu=mod(125.1228-.0529538083*d-ayan(j));out.Rahu=rahu;out.Ketu=mod(rahu+180);

}
function gmst(j){let T=(j-2451545)/36525;return mod(280.46061837+360.98564736629*(j-2451545)+.000387933*T*T-T*T*T/38710000)}
function asc(date,lat,lon){
 let j=jd(date),theta=rad(mod(gmst(j)+lon)),eps=rad(23.439291),phi=rad(lat);

}
function nak(lon){let u=mod(lon)/(360/27),i=Math.floor(u),frac=u-i;return {i,frac,pada:Math.floor(frac*4)+1,lordIndex:i%9}}

function navamsa(lon){
 let s=signIndex(lon),part=Math.floor((mod(lon)%30)/(30/9)),start;
 if([0,3,6,9].includes(s))start=s;
 else if([1,4,7,10].includes(s))start=mod(s+8,12);
 else start=mod(s+4,12);
 return mod(start+part,12);
}
function toDate(y,m,d,h,min,ap,tz){
 let hh=+h;if(ap==='PM'&&hh<12)hh+=12;if(ap==='AM'&&hh===12)hh=0;
 let local=new Date(+y,+m-1,+d,hh,+min,0);
 let offset=local.getTimezoneOffset();
 if(tz==='Asia/Kolkata')offset=-330;
 else if(Number.isFinite(+tz))offset=-(+tz*60);
 return new Date(Date.UTC(+y,+m-1,+d,hh,+min)-(-offset)*60000);
}
function chart(date,lat,lon){
 let pos=positions(date),a=asc(date,+lat,+lon),mn=nak(pos.Moon);
 return {date,pos,asc:a,ascSign:signIndex(a),moonSign:signIndex(pos.Moon),sunSign:signIndex(pos.Sun),moonNak:mn,nav:Object.fromEntries(Object.entries(pos).map(([p,l])=>[p,navamsa(l)])),ascNav:navamsa(a)};
}
function vimshottari(c,birth,at=new Date()){
 let n=c.moonNak,startLord=n.lordIndex,elapsed=n.frac*DURATION[startLord],start=new Date(birth.getTime()-elapsed*365.2425*86400000),rows=[],cur=start;
 for(let k=0;k<18;k++){let idx=(startLord+k)%9,end=new Date(cur.getTime()+DURATION[idx]*365.2425*86400000);rows.push({idx,start:new Date(cur),end});cur=end}
 let md=rows.find(x=>at>=x.start&&at<x.end)||rows[0];
 if(!md)return {md:null,ad:null};
 let mdYears=DURATION[md.idx],mdMs=mdYears*365.2425*86400000,adStart=md.start,ad=null;
 for(let k=0;k<9;k++){
  let ai=(md.idx+k)%9,dur=mdMs*(DURATION[ai]/120),end=new Date(adStart.getTime()+dur);
  if(at>=adStart&&at<end){ad={idx:ai,start:new Date(adStart),end};break}

}
function tithi(date){let p=positions(date),diff=mod(p.Moon-p.Sun),n=Math.floor(diff/12)+1;return {n,index:(n-1)%15,paksha:n<=15?0:1}}
function yoga(date){let p=positions(date);return Math.floor(mod(p.Sun+p.Moon)/(360/27))}
function karana(date){let p=positions(date);return Math.floor(mod(p.Moon-p.Sun)/6)}

})();
