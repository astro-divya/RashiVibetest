(()=> {
  const root=document.documentElement;
  let lang=localStorage.getItem('rvLang')||'hi';
  function applyLang(){
    root.lang=lang;
    document.querySelectorAll('[data-hi][data-en]').forEach(el=>{
      const val=el.getAttribute('data-'+lang);
      if(el.matches('input[placeholder]')) el.placeholder=val;
      else if(val && val.includes('<')) el.innerHTML=val;
      else el.textContent=val;
    });
    document.querySelectorAll('[data-title-hi][data-title-en]').forEach(el=>el.title=el.getAttribute('data-title-'+lang));
    const b=document.getElementById('langBtn'); if(b)b.textContent=lang==='hi'?'ENG':'हिंदी';

  }
  window.RVLang=()=>lang;
  window.RVT=(hi,en)=>lang==='hi'?hi:en;
  window.RVSetLang=()=>{lang=lang==='hi'?'en':'hi';localStorage.setItem('rvLang',lang);applyLang()};
  document.addEventListener('DOMContentLoaded',()=>{
    applyLang();
    const lb=document.getElementById('langBtn');if(lb)lb.onclick=RVSetLang;
    const mb=document.getElementById('menuBtn'),nl=document.getElementById('navlinks');if(mb&&nl){mb.onclick=()=>{const open=nl.classList.toggle('open');mb.setAttribute('aria-expanded',String(open));};nl.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{nl.classList.remove('open');mb.setAttribute('aria-expanded','false');}));}
    const clock=document.getElementById('liveClock');
    function tick(){
      if(!clock)return;
      const now=new Date(),loc=lang==='hi'?'hi-IN':'en-IN';
      clock.textContent=new Intl.DateTimeFormat(loc,{weekday:'short',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true}).format(now);
    }
    tick();setInterval(tick,1000);

})();

function setupLocation(prefix){
 const input=document.getElementById(prefix+'Place'),box=document.getElementById(prefix+'Suggest');
 if(!input||!box)return;let timer;
 input.addEventListener('input',()=>{clearTimeout(timer);const q=input.value.trim();if(q.length<3){box.innerHTML='';return}
  timer=setTimeout(async()=>{try{
   const res=await fetch('https://photon.komoot.io/api/?limit=6&q='+encodeURIComponent(q));const data=await res.json();
   box.innerHTML=(data.features||[]).map((f,i)=>{
    const p=f.properties||{},name=[p.name,p.city,p.state,p.country].filter(Boolean).filter((x,j,a)=>a.indexOf(x)===j).join(', ');
    return `<button type="button" data-i="${i}">${name}</button>`}).join('');
   [...box.querySelectorAll('button')].forEach((b,i)=>b.onclick=async()=>{
    const f=data.features[i],p=f.properties||{},name=[p.name,p.city,p.state,p.country].filter(Boolean).filter((x,j,a)=>a.indexOf(x)===j).join(', ');
    input.value=name;document.getElementById(prefix+'Lat').value=f.geometry.coordinates[1].toFixed(6);document.getElementById(prefix+'Lon').value=f.geometry.coordinates[0].toFixed(6);box.innerHTML='';
    const tz=document.getElementById(prefix+'Tz');
    try{const tr=await fetch(`https://timeapi.io/api/timezone/coordinate?latitude=${f.geometry.coordinates[1]}&longitude=${f.geometry.coordinates[0]}`);if(tr.ok){const td=await tr.json();tz.value=td.timeZone||td.timezone||Intl.DateTimeFormat().resolvedOptions().timeZone}}
    catch(e){tz.value=Intl.DateTimeFormat().resolvedOptions().timeZone}
   });
  }catch(e){box.innerHTML='<div class="notice">'+RVT('स्थान खोज उपलब्ध नहीं है। Latitude/Longitude नीचे भर सकते हैं।','Place search is unavailable. You can enter latitude/longitude below.')+'</div>'}},350)
 })
}
function validBirth(prefix){
 const d=+document.getElementById(prefix+'D').value,m=+document.getElementById(prefix+'M').value,y=+document.getElementById(prefix+'Y').value;
 if(!/^\d{4}$/.test(String(document.getElementById(prefix+'Y').value))||y<1900||y>new Date().getFullYear()||m<1||m>12||d<1||d>31)return null;
 const test=new Date(y,m-1,d);if(test.getFullYear()!=y||test.getMonth()!=m-1||test.getDate()!=d)return null;
 return {d,m,y};
}
function setupDateInputs(prefix){
 const ids=[prefix+'D',prefix+'M',prefix+'Y'],preview=document.getElementById(prefix+'DatePreview');
 ids.forEach(id=>document.getElementById(id)?.addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,+e.target.maxLength);const b=validBirth(prefix);preview.textContent=b?new Intl.DateTimeFormat(RVLang()==='hi'?'hi-IN':'en-IN',{day:'2-digit',month:'long',year:'numeric'}).format(new Date(b.y,b.m-1,b.d)):RVT('पहले दिन, फिर महीना, फिर वर्ष भरें','Enter day, then month, then year')}));
}
